version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: skillchallenge_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: skillchallenge_ladder
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillchallenge_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/skillchallenge_ladder
      - JWT_SECRET=skillchallenge_ladder_production_secret_key_2026_jwt
      - CLIENT_URL=http://localhost:5000
    depends_on:
      - mongodb

volumes:
  mongo_data:
